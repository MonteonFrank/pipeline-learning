name: Multi-Environment Pipeline

on:
  push:
    branches:
      - develop
      - pre-prod
      - main

# 1. ADD THIS: Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'pre-prod' && 'staging' || 'dev' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Site Structure
        run: |
          mkdir public
          if [ "${{ github.ref_name }}" == "main" ]; then
            cp index.html public/
          elif [ "${{ github.ref_name }}" == "pre-prod" ]; then
            mkdir public/staging
            cp index.html public/staging/
          else
            mkdir public/dev
            cp index.html public/dev/
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      # 2. ADD THIS: This actually pushes the artifact to the live site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4