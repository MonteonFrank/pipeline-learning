name: Multi-Environment Pipeline

on:
  push:
    branches:
      - develop
      - pre-prod
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This points the workflow to the environment GitHub uses for Pages hosting
    environment:
      name: github-pages
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Site Structure
        run: |
          mkdir -p public
          if [ "${{ github.ref_name }}" == "main" ]; then
            cp index.html public/
          elif [ "${{ github.ref_name }}" == "pre-prod" ]; then
            mkdir -p public/staging
            cp index.html public/staging/
          else
            mkdir -p public/dev
            cp index.html public/dev/
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This uploads the CONTENTS of public/, preventing 
          # an extra 'public' folder in your URL path
          path: 'public/.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4